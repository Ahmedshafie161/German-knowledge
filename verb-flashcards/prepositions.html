<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verben mit Präpositionen</title><style>body{font:18px system-ui;background:#f5f7f3;color:#183d36;margin:0}main{max-width:760px;margin:30px auto;padding:24px}nav{display:flex;gap:20px}section{background:white;border:1px solid #dbe5df;border-radius:22px;padding:28px;margin-top:24px}button,select,input{font:inherit;padding:12px;border:1px solid #c9d9cf;border-radius:12px;margin:5px;background:white;color:inherit}button{cursor:pointer}#sentence{font-size:28px;line-height:1.7}.primary{background:#176955;color:white}#feedback{white-space:pre-line;line-height:1.7}a{color:#176955}</style><main><nav><a href="verbs.html">Verbs</a><a href="aspekte.html">Aspekte</a><a href="study.html">Study</a></nav><h1>Verben mit Präpositionen</h1><p>Fill in the missing preposition. Then practise the complete sentence aloud.</p><label>Practice mode <select id="mode"><option value="normal">Normal sentence</option><option value="question">Question</option><option value="dass">dass clause</option></select></label><label><input type="checkbox" id="auto" checked> Read answer aloud</label><section><small id="position"></small><p id="sentence" lang="de"></p><form id="form"><input id="attempt" aria-label="Missing preposition" placeholder="Preposition" autocomplete="off"><button class="primary">Check answer</button></form><p id="feedback" role="status"></p><button id="reveal">Show answer</button><button id="speak" hidden>▶ Read again</button><button id="next">Next →</button></section><p id="note"></p></main><script>const DATA=[{"sentence": "Ich denke an den Mann.", "prep": "an", "blank": "Ich denke ___ den Mann"}, {"sentence": "Ich erinnere mich an den Tag.", "prep": "an", "blank": "Ich erinnere mich ___ den Tag"}, {"sentence": "Halt dich an die Regeln.", "prep": "an", "blank": "Halt dich ___ die Regeln"}, {"sentence": "Ich knüpfe an deinen Plan an.", "prep": "an", "blank": "I
