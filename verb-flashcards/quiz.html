se","cue":"بصوت واطي","image":"images/optimized/images/adverbs/adv-246.webp","galleryGroup":"adverb:Essential contrasts"},{"id":"adverb:laut","kind":"adverb","word":"laut","cue":"بصوت عالي","image":"images/optimized/images/adverbs/adv-247.webp","galleryGroup":"adverb:Essential contrasts"},{"id":"adverb:genau","kind":"adverb","word":"genau","cue":"بالظبط؛ بدقة","image":"images/optimized/images/adverbs/adv-248.webp","galleryGroup":"adverb:Essential contrasts"},{"id":"adverb:bewusst","kind":"adverb","word":"bewusst","cue":"بوعي وعن إدراك","image":"images/optimized/images/adverbs/adv-249.webp","galleryGroup":"adverb:Essential contrasts"},{"id":"adverb:pünktlich","kind":"adverb","word":"pünktlich","cue":"في المعاد بالظبط","image":"images/optimized/images/adverbs/adv-250.webp","galleryGroup":"adverb:Essential contrasts"}];
const $=id=>document.getElementById(id),KEY='german-arabic-choice-v1';
let history={},queue=[],current=null,answered=false,firstTries=0,correct=0,total=0,done=0,missed=new Set(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))history=saved;}catch{storageOK=false;}
const norm=s=>s.normalize('NFC').trim().toLocaleLowerCase('de');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function options(c){const seen=new Set([norm(c.word)]);const candidates=CARDS.filter(x=>x.kind===c.kind&&norm(x.cue)!==norm(c.cue)&&norm(x.word)!==norm(c.word));const related=shuffle(candidates.filter(x=>x.galleryGroup===c.galleryGroup)),others=shuffle(candidates.filter(x=>x.galleryGroup!==c.galleryGroup));const result=[c];for(const x of [...related,...others]){if(seen.has(norm(x.word)))continue;seen.add(norm(x.word));result.push(x);if(result.length===4)break;}return shuffle(result);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(history));}catch{storageOK=false;}}
function stats(){$('stats').textContent=`${done}/${total} mastered this session · ${correct}/${firstTries} correct first try${storageOK?'':' · progress not saved'}`;$('progress').max=total||1;$('progress').value=done;}
function start(){const pool=shuffle(CARDS.filter(c=>$('kind').value==='mixed'||c.kind===$('kind').value));pool.sort((a,b)=>((history[b.id]?.wrong||0)-(history[b.id]?.right||0))-((history[a.id]?.wrong||0)-(history[a.id]?.right||0)));const seen=new Set();queue=pool.filter(c=>{const k=norm(c.word)+'|'+norm(c.cue);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,Number($('limit').value)||10);total=queue.length;done=correct=firstTries=0;missed=new Set();render();}
function render(){current=queue[0];answered=false;$('choices').replaceChildren();$('feedback').textContent='';$('next').hidden=true;$('picture').hidden=true;stats();if(!current){$('cue').textContent='';$('type').textContent='Session complete';$('feedback').textContent=`${correct} of ${firstTries} correct on your first try. All ${done} meanings practised successfully.`;return;}$('type').textContent=current.kind+ (missed.has(current.id)?' · Try again':'');$('cue').textContent=current.cue;for(const choice of options(current)){const b=document.createElement('button');b.lang='de';b.textContent=choice.word;b.onclick=()=>choose(choice.word);$('choices').append(b);}}
function choose(word){if(answered||!current)return;answered=true;const ok=norm(word)===norm(current.word),retry=missed.has(current.id);if(!retry){firstTries++;if(ok)correct++;}for(const b of $('choices').children){b.disabled=true;if(norm(b.textContent)===norm(current.word)){b.className='correct';b.textContent+=' ✓';}else if(norm(b.textContent)===norm(word)){b.className='wrong';b.textContent+=' ✕';}}const old=history[current.id]||{};history[current.id]={right:(Number(old.right)||0)+(ok?1:0),wrong:(Number(old.wrong)||0)+(ok?0:1),last:Date.now()};save();queue.shift();if(ok){done++;$('feedback').textContent='Correct ✓ '+current.word;}else{missed.add(current.id);queue.splice(Math.min(3,queue.length),0,current);$('feedback').textContent='Correct answer: '+current.word+' — you’ll try this again.';}$('picture').src=current.image;$('picture').hidden=false;$('next').hidden=false;stats();}
$('next').onclick=render;$('start').onclick=start;$('kind').onchange=start;$('limit').onchange=start;start();
</script></html>
